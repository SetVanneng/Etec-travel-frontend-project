<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Travel & Explore - discover destinations, hotels and activities." />
    <title>Travel & Explore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme BEFORE Vue loads so the page
      // does not flash the wrong color mode.
      var savedTheme = localStorage.getItem('theme')
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script>
      // Apply the saved language BEFORE Vue loads so Khmer typography kicks
      // in immediately instead of flashing in the English font.
      var savedLocale = localStorage.getItem('language') || localStorage.getItem('locale')
      if (savedLocale === 'kh') savedLocale = 'km' // legacy value migration
      document.documentElement.lang =
        savedLocale === 'en' || savedLocale === 'km' ? savedLocale : 'km'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
